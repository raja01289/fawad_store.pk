<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fawad Store PK</title><link rel="stylesheet" href="style.css"></head><body><header><b>Fawad<span>Store</span> PK</b><input id="search" placeholder="Search products..."><button onclick="openCart()">🛒 Cart (<i id="count">0</i>)</button><button onclick="adminLogin()">Admin</button></header><main><section class="hero"><h1>Play. Wear. Win.</h1><p>Football, cricket, shoes & sports accessories.</p><button onclick="document.querySelector('#products').scrollIntoView({behavior:'smooth'})">Shop Now</button></section><section class="wrap"><h2>Products</h2><div id="cats"></div><div id="products" class="grid"></div></section></main><footer>Fawad Store PK • WhatsApp: 03405049439 • Cash on Delivery</footer><div id="cart" class="overlay"><aside><button class="x" onclick="closeCart()">✕</button><h2>Your Cart</h2><div id="items"></div><h3>Total: <span id="total">PKR 0</span></h3><button class="green" onclick="checkout()">Checkout on WhatsApp</button></aside></div><div id="checkout" class="modal"><div class="box"><button class="x" onclick="hide('checkout')">✕</button><h2>Cash on Delivery</h2><input id="name" placeholder="Full Name"><input id="phone" placeholder="Phone Number"><textarea id="address" placeholder="Complete Address"></textarea><button class="green" onclick="sendOrder()">Send Order</button></div></div><div id="admin" class="modal"><div class="box"><button class="x" onclick="hide('admin')">✕</button><h2>Admin Panel</h2><input id="pn" placeholder="Product name"><input id="pp" type="number" placeholder="Price PKR"><select id="pc"><option>Football</option><option>Cricket</option><option>Shoes</option><option>Accessories</option></select><input id="pi" placeholder="Emoji e.g. ⚽"><button class="green" onclick="addProduct()">Add Product</button><hr><div id="adminList"></div></div></div><script src="script.js"></script></body></html>
